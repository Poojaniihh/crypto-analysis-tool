<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Analysis AI Tool</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">

    <h1>Crypto Analysis Tool</h1>
    <p>Analyze or compare crypto currencies using AI</p>

    <div class="input-box">
        <input type="text" id="coinInput" placeholder="Enter coins (e.g., bitcoin, ethereum)">
    </div>

    <div class="button-group">
        <button onclick="analyze()">Analyze</button>
        <button onclick="compare()">Compare</button>
    </div>

    <div id="output" class="output-box"></div>

</div>

<script src="script.js"></script>

</body>
</html>
